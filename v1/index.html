<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מילים באנגלית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Rubik:wght@400;600&display=swap" rel="stylesheet">
<style>
:root { --bg: #FBF5ED; --ink: #264653; --card: #ffffff; --line: #E6D3B9; --accent: #E76F51; --soft: #2A9D8F; --gold: #E9C46A; --muted: #8a9aa0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1d2a30; --ink: #FBF5ED; --card: #264653; --line: #3b5560; --accent: #F4A261; --soft: #7cc7bd; --gold: #E9C46A; --muted: #9fb1b6; } }
:root[data-theme="dark"] { --bg: #1d2a30; --ink: #FBF5ED; --card: #264653; --line: #3b5560; --accent: #F4A261; --soft: #7cc7bd; --gold: #E9C46A; --muted: #9fb1b6; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Rubik", Arial, sans-serif; font-size: 18px; line-height: 1.5; }
main { max-width: 560px; margin: 0 auto; padding: 14px 16px 40px; }
.en { font-family: "Andika", Arial, sans-serif; direction: ltr; unicode-bidi: isolate; }
h1 { font-size: 23px; margin: 4px 0 2px; }
.sub { color: var(--muted); margin: 0 0 14px; font-size: 16px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.screen { display: none; }
.screen.on { display: block; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.home-btn { background: none; border: 0; color: var(--ink); text-decoration: underline; padding: 6px 0; }
.count { color: var(--muted); font-size: 16px; }

/* בית */
.tiles { display: grid; gap: 12px; }
.tile { display: flex; align-items: center; gap: 14px; text-align: right; background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 14px 16px; }
.tile .num { width: 40px; height: 40px; flex: none; border-radius: 50%; background: var(--soft); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 20px; }
.tile b { display: block; font-size: 20px; }
.tile span.d { color: var(--muted); font-size: 15px; }
.tile .stars { margin-inline-start: auto; color: var(--gold); font-size: 20px; letter-spacing: 2px; }
.how { margin-top: 18px; color: var(--muted); font-size: 15px; }

/* כרטיסיות */
.fc { background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: 12px; text-align: center; }
.fc img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 14px; display: block; }
.fc .back { display: none; padding: 10px 0 2px; }
.fc.flip .back { display: block; }
.fc .back .en { font-size: 40px; font-weight: 700; display: block; line-height: 1.2; }
.fc .back .he { font-size: 24px; }
.row { display: flex; gap: 10px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
.btn { min-height: 52px; padding: 8px 20px; border-radius: 26px; border: 2px solid var(--soft); background: transparent; display: inline-flex; align-items: center; gap: 8px; font-size: 18px; }
.btn.main { background: var(--soft); color: #fff; }
.btn:disabled { opacity: .35; cursor: default; }
.spk { width: 22px; height: 22px; flex: none; }

/* בחירה */
.q-img { width: 100%; max-width: 360px; aspect-ratio: 1; object-fit: cover; border-radius: 18px; display: block; margin: 0 auto 12px; border: 2px solid var(--line); }
.opts { display: grid; gap: 10px; }
.opt { display: flex; align-items: center; gap: 10px; background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 8px 10px; }
.opt .play { min-width: 112px; justify-content: center; }
.opt .pick { margin-inline-start: auto; min-height: 52px; padding: 6px 16px; border-radius: 14px; border: 2px dashed var(--line); background: transparent; font-size: 17px; }
.opt.heard .pick { border-style: solid; border-color: var(--soft); }
.opt.no { opacity: .4; }
.opt.no .pick { text-decoration: line-through; }
.opt.yes { border-color: var(--soft); background: color-mix(in srgb, var(--soft) 14%, var(--card)); }
.opt .word { display: none; font-size: 22px; }
.opt.yes .word { display: inline; }
.msg { min-height: 30px; text-align: center; margin: 10px 0 0; font-size: 19px; }
.done { text-align: center; background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 22px 16px; }
.done .big { font-size: 46px; color: var(--gold); letter-spacing: 4px; }

/* זיכרון */
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mc { aspect-ratio: 1; border-radius: 14px; border: 2px solid var(--line); background: var(--soft); padding: 0; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; }
.mc .face { display: none; width: 100%; height: 100%; align-items: center; justify-content: center; flex-direction: column; background: var(--card); }
.mc.open .face, .mc.got .face { display: flex; }
.mc img { width: 100%; height: 100%; object-fit: cover; }
.mc .face .spk { width: 40px; height: 40px; color: var(--soft); }
.mc .face .en { font-size: 18px; }
.mc .q { color: #fff; font-size: 30px; opacity: .85; }
.mc.open .q, .mc.got .q { display: none; }
.mc.got { border-color: var(--gold); border-width: 3px; }
.legend { display: flex; gap: 14px; justify-content: center; color: var(--muted); font-size: 15px; margin: 4px 0 10px; }
</style>
</head>
<body>
<main>

<section id="home" class="screen on">
  <h1>מילים באנגלית: <span id="setTitle"></span></h1>
  <p class="sub">שומעים, רואים, זוכרים. עוד לא צריך לקרוא.</p>
  <div class="tiles">
    <button class="tile" data-go="cards"><span class="num">1</span><span><b>כרטיסיות</b><span class="d">רואים תמונה ושומעים את המילה</span></span><span class="stars" id="st-cards"></span></button>
    <button class="tile" data-go="quiz"><span class="num">2</span><span><b>מה שומעים?</b><span class="d">תמונה אחת, ארבע מילים. בוחרים</span></span><span class="stars" id="st-quiz"></span></button>
    <button class="tile" data-go="memory"><span class="num">3</span><span><b>משחק זיכרון</b><span class="d">מוצאים זוג: תמונה ומילה</span></span><span class="stars" id="st-memory"></span></button>
  </div>
  <p class="how">כדאי לעבוד לפי הסדר: קודם כרטיסיות, אחר כך שאלות, ובסוף זיכרון.</p>
</section>

<section id="cards" class="screen">
  <div class="top"><button class="home-btn" data-go="home">→ חזרה</button><span class="count" id="fcCount"></span></div>
  <div class="fc" id="fc">
    <img id="fcImg" alt="">
    <div class="back"><span class="en" id="fcEn"></span><span class="he" id="fcHe"></span></div>
  </div>
  <div class="row">
    <button class="btn main" id="fcPlay"></button>
    <button class="btn" id="fcFlip">מה המילה?</button>
  </div>
  <div class="row">
    <button class="btn" id="fcPrev">→ הקודמת</button>
    <button class="btn" id="fcNext">הבאה ←</button>
  </div>
</section>

<section id="quiz" class="screen">
  <div class="top"><button class="home-btn" data-go="home">→ חזרה</button><span class="count" id="qCount"></span></div>
  <div id="qBody">
    <img class="q-img" id="qImg" alt="">
    <div class="opts" id="qOpts"></div>
    <p class="msg" id="qMsg" aria-live="polite"></p>
    <div class="row"><button class="btn main" id="qNext" hidden>לשאלה הבאה ←</button></div>
  </div>
  <div class="done" id="qDone" hidden></div>
</section>

<section id="memory" class="screen">
  <div class="top"><button class="home-btn" data-go="home">→ חזרה</button><span class="count" id="mCount"></span></div>
  <div class="legend"><span>כל זוג = תמונה + מילה שומעים</span></div>
  <div class="grid" id="mGrid"></div>
  <p class="msg" id="mMsg" aria-live="polite"></p>
  <div class="done" id="mDone" hidden></div>
</section>

</main>
<script>
const SET = {"id": "v1", "title": "המשפחה שלי ומי שסביבי", "base": "", "clash": [["sister", "friend"]], "words": [{"en": "mom", "he": "אמא"}, {"en": "dad", "he": "אבא"}, {"en": "grandma", "he": "סבתא"}, {"en": "grandpa", "he": "סבא"}, {"en": "brother", "he": "אח"}, {"en": "sister", "he": "אחות"}, {"en": "baby", "he": "תינוק"}, {"en": "family", "he": "משפחה"}, {"en": "teacher", "he": "מורה"}, {"en": "friend", "he": "חבר / חברה"}, {"en": "home", "he": "בית"}, {"en": "school", "he": "בית ספר"}]};
const SPK = '<svg class="spk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const W = SET.words;
const $ = id => document.getElementById(id);
const player = new Audio();
function say(w) { player.pause(); player.src = `${SET.base}audio/v-${w.en}.mp3`; player.currentTime = 0; player.play().catch(() => {}); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
// זוגות שנראים דומים בתמונה: לא מופיעים יחד באותה שאלה או באותו סבב זיכרון
const CLASH = (SET.clash || []).map(p => new Set(p));
const clash = (a, b) => CLASH.some(s => s.has(a.en) && s.has(b.en));
const img = w => `${SET.base}img/${w.en}.webp`;

// כוכבים נשמרים רק בדפדפן הזה
const KEY = 'words-' + SET.id;
let prog = {};
try { prog = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
function star(part, n) { prog[part] = Math.max(prog[part] || 0, n); try { localStorage.setItem(KEY, JSON.stringify(prog)); } catch (e) {} showStars(); }
function showStars() { for (const p of ['cards', 'quiz', 'memory']) $('st-' + p).textContent = '★'.repeat(prog[p] || 0); }

function go(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  player.pause(); window.scrollTo(0, 0);
  if (id === 'cards') startCards();
  if (id === 'quiz') startQuiz();
  if (id === 'memory') startMemory(0);
}
document.addEventListener('click', ev => { const b = ev.target.closest('[data-go]'); if (b) go(b.dataset.go); });

// ---------- 1. כרטיסיות ----------
let fi = 0, seen = new Set();
function startCards() { fi = 0; seen = new Set(); showCard(); }
function showCard() {
  const w = W[fi];
  $('fcImg').src = img(w); $('fcImg').alt = w.he;
  $('fcEn').textContent = w.en; $('fcHe').textContent = w.he;
  $('fc').classList.remove('flip');
  $('fcCount').textContent = `${fi + 1} מתוך ${W.length}`;
  $('fcPrev').disabled = fi === 0;
  $('fcNext').textContent = fi === W.length - 1 ? 'סיימתי ✓' : 'הבאה ←';
  seen.add(fi); say(w);
}
$('fcPlay').innerHTML = SPK + 'שומעים שוב';
$('fcPlay').onclick = () => say(W[fi]);
$('fcFlip').onclick = () => { $('fc').classList.toggle('flip'); };
$('fcImg').onclick = () => say(W[fi]);
$('fcPrev').onclick = () => { if (fi > 0) { fi--; showCard(); } };
$('fcNext').onclick = () => {
  if (fi < W.length - 1) { fi++; showCard(); }
  else { if (seen.size === W.length) star('cards', 3); go('home'); }
};

// ---------- 2. מה שומעים? ----------
const QN = Math.min(10, W.length);
let qs = [], qi = 0, firstTry = 0, tries = 0;
function startQuiz() {
  qs = shuffle(W).slice(0, QN); qi = 0; firstTry = 0;
  $('qBody').hidden = false; $('qDone').hidden = true; showQ();
}
function showQ() {
  const w = qs[qi]; tries = 0;
  const others = shuffle(W.filter(x => x !== w && !clash(x, w)));
  const opts = [w];
  for (const x of others) { if (opts.length === 4) break; if (!opts.some(o => clash(o, x))) opts.push(x); }
  $('qImg').src = img(w); $('qImg').alt = 'תמונה';
  $('qCount').textContent = `שאלה ${qi + 1} מתוך ${QN}`;
  $('qMsg').textContent = 'שומעים את כל ארבע המילים. אחר כך בוחרים: איזו מילה מתאימה לתמונה?';
  $('qNext').hidden = true;
  const box = $('qOpts'); box.innerHTML = '';
  shuffle(opts).forEach((o, k) => {
    const row = document.createElement('div'); row.className = 'opt';
    row.innerHTML = `<button class="btn play">${SPK}מילה ${k + 1}</button><span class="en word">${o.en}</span><button class="pick">זו המילה</button>`;
    row.querySelector('.play').onclick = () => { say(o); row.classList.add('heard'); };
    row.querySelector('.pick').onclick = () => pick(row, o, w);
    box.appendChild(row);
  });
}
function pick(row, o, w) {
  if (!$('qNext').hidden || row.classList.contains('no')) return;
  tries++;
  if (o === w) {
    row.classList.add('yes'); say(w);
    if (tries === 1) firstTry++;
    $('qMsg').textContent = `נכון! ${w.he} = ${w.en}`;
    $('qNext').hidden = false;
    $('qNext').textContent = qi === QN - 1 ? 'לסיום ←' : 'לשאלה הבאה ←';
  } else {
    row.classList.add('no');
    $('qMsg').textContent = 'לא זו. מקשיבים שוב לשאר המילים ובוחרים.';
  }
}
$('qNext').onclick = () => {
  if (qi < QN - 1) { qi++; showQ(); return; }
  const s = firstTry >= QN - 1 ? 3 : firstTry >= QN / 2 ? 2 : 1;
  star('quiz', s);
  $('qBody').hidden = true; $('qDone').hidden = false;
  $('qDone').innerHTML = `<div class="big">${'★'.repeat(s)}</div><p>בחרת נכון בפעם הראשונה ב־${firstTry} מתוך ${QN} שאלות.</p><div class="row"><button class="btn main" data-go="quiz">עוד סבב</button><button class="btn" data-go="home">חזרה</button></div>`;
};

// ---------- 3. משחק זיכרון ----------
// 12 מילים = 2 סבבים של 6 זוגות. מילים שנראות דומות לא באותו סבב.
let rounds = [], ri = 0, open = [], lock = false, moves = 0, found = 0;
function makeRounds() {
  for (let t = 0; t < 50; t++) {
    const s = shuffle(W), a = s.slice(0, 6), b = s.slice(6, 12);
    const ok = r => r.every((x, i) => r.every((y, j) => i === j || !clash(x, y)));
    if (ok(a) && ok(b)) return [a, b].filter(r => r.length);
  }
  return [W.slice(0, 6), W.slice(6, 12)];
}
function startMemory(r) {
  if (r === 0) rounds = makeRounds();
  ri = r; open = []; lock = false; moves = 0; found = 0;
  $('mDone').hidden = true; $('mGrid').hidden = false;
  const cards = shuffle(rounds[ri].flatMap(w => [{ w, kind: 'img' }, { w, kind: 'snd' }]));
  const g = $('mGrid'); g.innerHTML = '';
  cards.forEach(c => {
    const b = document.createElement('button'); b.className = 'mc';
    b.setAttribute('aria-label', c.kind === 'img' ? 'קלף תמונה' : 'קלף מילה');
    b.innerHTML = `<span class="q">?</span><span class="face">${c.kind === 'img' ? `<img src="${img(c.w)}" alt="">` : SPK + `<span class="en" hidden>${c.w.en}</span>`}</span>`;
    b.onclick = () => flip(b, c);
    g.appendChild(b);
  });
  $('mCount').textContent = `סבב ${ri + 1} מתוך ${rounds.length}`;
  $('mMsg').textContent = 'הופכים שני קלפים: תמונה ומילה. אם הם שייכים זה לזה, הם נשארים פתוחים.';
}
function flip(b, c) {
  if (lock || b.classList.contains('open') || b.classList.contains('got')) return;
  if (open.length === 1 && open[0].c.kind === c.kind) { $('mMsg').textContent = c.kind === 'img' ? 'עכשיו הופכים קלף מילה (עם רמקול).' : 'עכשיו הופכים קלף תמונה.'; return; }
  b.classList.add('open');
  if (c.kind === 'snd') say(c.w);
  open.push({ b, c });
  if (open.length < 2) return;
  moves++;
  const [x, y] = open;
  if (x.c.w === y.c.w) {
    for (const o of open) { o.b.classList.remove('open'); o.b.classList.add('got'); const t = o.b.querySelector('.en'); if (t) t.hidden = false; }
    open = []; found++;
    $('mMsg').textContent = `זוג! ${x.c.w.en} = ${x.c.w.he}`;
    if (found === rounds[ri].length) setTimeout(endRound, 900);
  } else {
    lock = true;
    $('mMsg').textContent = 'לא זוג. הקלפים נסגרים. זוכרים איפה הם היו?';
    setTimeout(() => { for (const o of open) o.b.classList.remove('open'); open = []; lock = false; }, 1600);
  }
}
function endRound() {
  const last = ri === rounds.length - 1;
  if (last) star('memory', moves <= 9 ? 3 : moves <= 14 ? 2 : 1);
  $('mGrid').hidden = true; $('mDone').hidden = false;
  $('mDone').innerHTML = `<div class="big">✓</div><p>מצאת ${found} זוגות ב־${moves} ניסיונות.</p><div class="row">` +
    (last ? `<button class="btn main" data-go="memory">לשחק שוב</button><button class="btn" data-go="home">חזרה</button>`
          : `<button class="btn main" id="mNextRound">לסבב ${ri + 2} ←</button>`) + '</div>';
  if (!last) $('mNextRound').onclick = () => startMemory(ri + 1);
}

$('setTitle').textContent = SET.title;
showStars();
</script>
</body>
</html>
